<svg
  xmlns="http://www.w3.org/2000/svg"
  width="512"
  height="512"
  viewBox="0 0 512 512"
  fill="none"
>
  <defs>
    <!-- Dark -->
    <linearGradient
      id="darkGradient"
      x1="170"
      y1="120"
      x2="300"
      y2="300"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#1C2A3A"/>
      <stop offset="1" stop-color="#05080D"/>
    </linearGradient>

    <!-- Cyan → Blue -->
    <linearGradient
      id="blueGradient"
      x1="390"
      y1="250"
      x2="250"
      y2="440"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#18DCEB"/>
      <stop offset="1" stop-color="#0758F5"/>
    </linearGradient>
  </defs>

  <!-- TOP / DARK BAR -->
  <rect
    x="155"
    y="205"
    width="240"
    height="76"
    rx="38"
    fill="url(#darkGradient)"
    transform="rotate(-48 275 243)"
  />

  <!-- BOTTOM / CYAN-BLUE BAR -->
  <rect
    x="240"
    y="298"
    width="240"
    height="76"
    rx="38"
    fill="url(#blueGradient)"
    transform="rotate(-48 360 336)"
  />
</svg>